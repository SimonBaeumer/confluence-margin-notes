name: Release

# Push a tag matching the version in package.json (e.g. v0.1.3) to build,
# sign through AMO's unlisted channel and publish a GitHub release with the
# signed .xpi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npm run lint:ext

      - name: Sign through AMO (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npm run sign

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xpi="margin-notes-$VERSION.xpi"
          mv web-ext-artifacts/*-"$VERSION".xpi "$xpi"
          gh release create "$GITHUB_REF_NAME" "$xpi" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
